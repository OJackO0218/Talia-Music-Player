name: Build Talia Windows Standalone Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Windows ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Pre-fetch static-ffmpeg binaries
        run: |
          python -c "import static_ffmpeg; static_ffmpeg.add_paths()"

      - name: Build Standalone Package
        run: |
          python tools/build_release.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Talia-Windows-x64
          path: dist/Talia-Windows-x64.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Talia-Windows-x64.zip
          tag_name: ${{ github.ref_name }}
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
