[project]
name = "talia"
version = "1.1.0"
description = "Transparent desktop music player, character overlay, and audio visualizer."
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "dist", "cache", "Talia Lyrics Fetch Automated/gui_fetcher.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gui: tests that need a Qt application (run offscreen)",
]
